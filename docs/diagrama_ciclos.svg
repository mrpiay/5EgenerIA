<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1038 694" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Los dos ciclos de 5EgenerIA</title>
  <desc id="d">Generador y evaluador secuenciales, fase a fase. Ciclo interno: las reglas del 5E y la base de conocimiento alimentan al planificador, que fija la fase; el generador IA la redacta y el verificador comprueba con reglas su estructura. La fase pasa al ciclo externo: el evaluador IA rellena la rúbrica de esa fase, que el generador no ve, y obtiene su valoración. Si la fase no alcanza el nivel máximo y quedan iteraciones, el ciclo externo ajusta las reglas (refuerzo) y la fase se genera de nuevo; el generador solo ve las reglas ajustadas. Cuando alcanza el máximo o se agotan las iteraciones, y siempre que supere el mínimo, se pasa a la fase siguiente. Tras la quinta fase, el resultado es la secuencia didáctica 5E con su fidelidad: cinco resultados, uno por fase. El evaluador aprende de rúbricas modelo y de las anotaciones de la supervisión humana, que se realiza cuando se puede, por fases y por secuencias completas (supervisado). Fuera del alcance, en línea punteada, el aula (fidelidad de implementación) como línea futura.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a78a8"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Marco común: 5EgenerIA -->
  <rect x="6" y="26" width="1026" height="566" rx="8" fill="none" stroke="#475569" stroke-width="1.5"/>
  <rect x="452" y="8" width="134" height="34" fill="#fff"/>
  <g font-weight="800" fill="#111827">
    <text x="462" y="35" font-size="22">5E</text>
    <text x="495.5" y="35" font-size="16" text-anchor="middle">G</text>
    <text x="507" y="35" font-size="16" text-anchor="middle">E</text>
    <text x="518.5" y="35" font-size="16" text-anchor="middle">N</text>
    <text x="530" y="35" font-size="16" text-anchor="middle">E</text>
    <text x="541.5" y="35" font-size="16" text-anchor="middle">R</text>
    <text x="548" y="35" font-size="22">IA</text>
  </g>
  <!-- Cinco puntos sobre GENER: las cinco fases, en secuencia -->
  <circle cx="495.5" cy="17" r="2" fill="#cbd5e1"><animate attributeName="fill" values="#cbd5e1;#4a78a8;#cbd5e1;#cbd5e1" keyTimes="0;0.12;0.28;1" dur="5s" begin="0s" repeatCount="indefinite"/></circle>
  <circle cx="507" cy="17" r="2" fill="#cbd5e1"><animate attributeName="fill" values="#cbd5e1;#4a78a8;#cbd5e1;#cbd5e1" keyTimes="0;0.12;0.28;1" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="518.5" cy="17" r="2" fill="#cbd5e1"><animate attributeName="fill" values="#cbd5e1;#4a78a8;#cbd5e1;#cbd5e1" keyTimes="0;0.12;0.28;1" dur="5s" begin="2s" repeatCount="indefinite"/></circle>
  <circle cx="530" cy="17" r="2" fill="#cbd5e1"><animate attributeName="fill" values="#cbd5e1;#4a78a8;#cbd5e1;#cbd5e1" keyTimes="0;0.12;0.28;1" dur="5s" begin="3s" repeatCount="indefinite"/></circle>
  <circle cx="541.5" cy="17" r="2" fill="#cbd5e1"><animate attributeName="fill" values="#cbd5e1;#4a78a8;#cbd5e1;#cbd5e1" keyTimes="0;0.12;0.28;1" dur="5s" begin="4s" repeatCount="indefinite"/></circle>

  <!-- Bandas -->
  <rect x="20" y="46" width="998" height="238" rx="6" fill="#f3f6fa"/>
  <text x="38" y="72" font-size="13" font-weight="700" fill="#1f2937" letter-spacing="1">CICLO INTERNO</text>
  <rect x="20" y="298" width="998" height="280" rx="6" fill="#f3f6fa"/>
  <text x="210" y="324" font-size="13" font-weight="700" fill="#1f2937" letter-spacing="1">CICLO EXTERNO</text>

  <!-- Ciclo interno: generador secuencial (sistema híbrido: sistema experto con funcionalidad extendida, reglas e IA generativa) -->
  <rect x="40" y="82" width="732" height="182" rx="6" fill="#fff" stroke="#4a78a8" stroke-width="1.5"/>
  <text x="56" y="102" font-size="12" font-weight="700" fill="#4a78a8" letter-spacing="1">GENERACIÓN SECUENCIAL 5E</text>
  <g font-size="15">
    <rect x="90" y="136" width="150" height="56" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="165" y="160" text-anchor="middle" font-weight="700" fill="#1f2937">Planificador</text>
    <text x="165" y="179" text-anchor="middle" font-size="13" fill="#5b6472">fija la fase</text>

    <rect x="326" y="132" width="170" height="64" rx="4" fill="#e8f0f9" stroke="#4a78a8" stroke-width="2"/>
    <text x="411" y="160" text-anchor="middle" font-weight="700" fill="#1f2937">Generador IA</text>
    <text x="411" y="179" text-anchor="middle" font-size="13" fill="#5b6472">redacta dentro del plan</text>

    <rect x="582" y="136" width="170" height="56" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="667" y="160" text-anchor="middle" font-weight="700" fill="#1f2937">Verificador</text>
    <text x="667" y="179" text-anchor="middle" font-size="13" fill="#5b6472">comprueba la estructura</text>
  </g>
  <!-- Entrada: reglas + base de conocimiento -->
  <rect x="90" y="224" width="662" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="421" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">Reglas 5E + base de conocimiento</text>
  <line x1="165" y1="224" x2="165" y2="196" stroke="#4a78a8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="667" y1="224" x2="667" y2="196" stroke="#4a78a8" stroke-width="2" marker-end="url(#a)"/>
  <!-- Flujo con bucle IA ⇄ verificador -->
  <line x1="240" y1="164" x2="322" y2="164" stroke="#4a78a8" stroke-width="2" marker-end="url(#a)"/>
  <text x="281" y="156" text-anchor="middle" font-size="12" fill="#5b6472">plan</text>
  <line x1="496" y1="154" x2="578" y2="154" stroke="#4a78a8" stroke-width="2" marker-end="url(#a)"/>
  <text x="537" y="146" text-anchor="middle" font-size="12" fill="#5b6472">borrador</text>
  <line x1="582" y1="180" x2="500" y2="180" stroke="#4a78a8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="539" y="212" text-anchor="middle" font-size="12" fill="#5b6472">si falla: qué regla y dónde</text>

  <!-- Ciclo externo: evaluador secuencial de fidelidad -->
  <rect x="210" y="334" width="788" height="224" rx="6" fill="#fff" stroke="#4a78a8" stroke-width="1.5"/>
  <text x="226" y="354" font-size="12" font-weight="700" fill="#4a78a8" letter-spacing="1">EVALUACIÓN SECUENCIAL DE FIDELIDAD</text>
  <g font-size="15">
    <rect x="793" y="374" width="180" height="62" rx="4" fill="#e8f0f9" stroke="#4a78a8" stroke-width="2"/>
    <text x="883" y="401" text-anchor="middle" font-weight="700" fill="#1f2937">Evaluador IA</text>
    <text x="883" y="419" text-anchor="middle" font-size="13" fill="#5b6472">valora la fase</text>

    <rect x="508" y="374" width="210" height="62" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="613" y="401" text-anchor="middle" font-weight="700" fill="#1f2937">Rúbrica de la fase</text>
    <text x="613" y="420" text-anchor="middle" font-size="13" fill="#5b6472">oculta al generador</text>

    <rect x="220" y="374" width="206" height="62" rx="4" fill="#fff" stroke="#4a78a8" stroke-width="2"/>
    <text x="323" y="401" text-anchor="middle" font-weight="700" fill="#1f2937">Valoración de la fase</text>
    <text x="323" y="420" text-anchor="middle" font-size="12" fill="#5b6472">itera hasta el máximo o el límite</text>

    <rect x="793" y="476" width="180" height="62" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="883" y="502" text-anchor="middle" font-weight="700" fill="#1f2937">Rúbricas modelo</text>
    <text x="883" y="521" text-anchor="middle" font-size="12" fill="#5b6472">+ supervisión humana</text>
  </g>
  <line x1="793" y1="405" x2="722" y2="405" stroke="#4a78a8" stroke-width="2" marker-end="url(#a)"/>
  <text x="757" y="397" text-anchor="middle" font-size="12" fill="#5b6472">rellena</text>
  <line x1="508" y1="405" x2="430" y2="405" stroke="#4a78a8" stroke-width="2" marker-end="url(#a)"/>
  <text x="469" y="397" text-anchor="middle" font-size="12" fill="#5b6472">da</text>
  <line x1="883" y1="476" x2="883" y2="440" stroke="#4a78a8" stroke-width="2" marker-end="url(#a)"/>
  <text x="873" y="462" text-anchor="end" font-size="12" fill="#5b6472">aprende (supervisado)</text>
  

  <!-- Vuelta al generador: fase siguiente o reglas ajustadas -->
  <path d="M220,386 L50,386 L50,164 L86,164" fill="none" stroke="#4a78a8" stroke-width="2" marker-end="url(#a)"/>
  <text x="160" y="379" text-anchor="middle" font-size="12" fill="#5b6472">fase siguiente</text>
  <path d="M220,420 L102,420 L102,256" fill="none" stroke="#4a78a8" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="161" y="437" text-anchor="middle" font-size="12" fill="#5b6472">reglas ajustadas</text>
  <text x="161" y="451" text-anchor="middle" font-size="12" fill="#5b6472">(refuerzo)</text>

  <!-- Resultado final, fuera de los ciclos -->
  <line x1="323" y1="436" x2="323" y2="618" stroke="#4a78a8" stroke-width="2" marker-end="url(#a)"/>
  <text x="333" y="506" font-size="12" fill="#5b6472">tras la 5.ª fase</text>
  <rect x="220" y="622" width="206" height="62" rx="4" fill="#4a78a8"/>
  <text x="323" y="648" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Secuencia didáctica 5E</text>
  <text x="323" y="667" text-anchor="middle" font-size="13" fill="#fff">fidelidad: 5 resultados</text>
  <!-- Fuera del alcance: el aula, línea futura -->
  <rect x="40" y="630" width="150" height="46" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="115" y="649" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6472">Aula · línea futura</text>
  <text x="115" y="666" text-anchor="middle" font-size="11" fill="#5b6472">implementación</text>
  <line x1="220" y1="653" x2="194" y2="653" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#g)"/>

  <!-- Paso de la fase al ciclo externo -->
  <path d="M752,163 L883,163 L883,370" fill="none" stroke="#4a78a8" stroke-width="2" marker-end="url(#a)"/>
  <text x="817" y="155" text-anchor="middle" font-size="12" fill="#5b6472">fase</text>
</svg>
